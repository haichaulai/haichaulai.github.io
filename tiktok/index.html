<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Share Result</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:24px;background:#000;color:#fff}
  h1{font-size:20px}
  p{color:#8a8a8a;font-size:15px;line-height:1.5}
  .k{color:#8a8a8a;font-size:13px;margin-top:14px}
  .v{font-size:17px;word-break:break-all;background:#161616;padding:10px 12px;border-radius:10px;margin-top:4px}
  .ok{color:#2dd36f} .err{color:#ff4d6a}
  a.open{display:inline-block;margin:20px 0;padding:12px 20px;border-radius:12px;background:#fff;color:#000;font-size:17px;font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <h1>TikTok share callback</h1>
  <!--
    TikTok reports the result of a Share Kit post by opening this page's URL.
    It is registered as Pixwand's universal link (see /.well-known/apple-app-site-association),
    so on a phone with Pixwand installed iOS normally hands it straight to the app
    and this page is never seen. If it is seen, the universal link didn't resolve
    (link not yet fetched by iOS, app reinstalled, opened on desktop…): bounce the
    same query over the app's own URL scheme so the share still answers in Pixwand.
    Add ?nobounce=1 to the URL to stay here and read the parameters.
  -->
  <p id="note"></p>
  <a class="open" id="open" style="display:none">Open Pixwand</a>
  <div id="out"></div>
<script>
  var params = new URLSearchParams(location.search);
  var hasParams = [...params].length > 0;
  var deepLink = 'pixwand://tiktok-share?' + location.search.replace(/^\?/, '');
  var note = document.getElementById('note');
  var open = document.getElementById('open');

  if (hasParams && params.get('nobounce') !== '1') {
    open.href = deepLink;
    open.style.display = 'inline-block';
    note.textContent = 'Taking you back to Pixwand…';
    location.replace(deepLink);
  } else if (!hasParams) {
    note.textContent = 'Opened directly — no share result to report.';
  }

  var out = document.getElementById('out');
  for (var [key, value] of params) {
    var cls = (key.indexOf('error') > -1 || key.indexOf('err') > -1) ? 'err'
            : (key.indexOf('state') > -1 && value === '20000') ? 'ok' : '';
    out.innerHTML += '<div class="k">' + key + '</div><div class="v ' + cls + '">' + value + '</div>';
  }
</script>
</body>
</html>
